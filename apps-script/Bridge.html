<!doctype html><html><head><meta charset="utf-8"></head><body><script>
'use strict';
const allowedOrigin=<?!= origin ?>, nonce=<?!= nonce ?>;
if(allowedOrigin&&window.top!==window){
  window.addEventListener('message',e=>{
    if(e.origin!==allowedOrigin||e.source!==window.top||!e.data||e.data.channel!=='market-request'||e.data.nonce!==nonce)return;
    const id=e.data.id;
    google.script.run.withSuccessHandler(result=>window.top.postMessage({channel:'market-response',nonce,id,result},allowedOrigin))
      .withFailureHandler(err=>window.top.postMessage({channel:'market-response',nonce,id,result:{ok:false,error:err.message||'تعذر الوصول إلى الخادم'}},allowedOrigin)).callApi(e.data.request);
  });
  window.top.postMessage({channel:'market-ready',nonce},allowedOrigin);
}
</script></body></html>
